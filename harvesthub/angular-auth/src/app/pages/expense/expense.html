<div class="container">

  <h1>Expense Management</h1>

  <div class="form-card">

    <h2>{{ editing ? 'Update Expense' : 'Add Expense' }}</h2>

    <div class="form-grid">

      <input
        type="text"
        placeholder="Expense Type"
        [(ngModel)]="expense.expenseType"
      >

      <input
        type="number"
        placeholder="Amount"
        [(ngModel)]="expense.amount"
      >

      <div class="date-field">

        <label>Expense Date</label>

        <input
          type="date"
          [(ngModel)]="expense.expenseDate"
        >

      </div>

      <input
        type="text"
        placeholder="Description"
        [(ngModel)]="expense.description"
      >

    </div>

    <div class="buttons">

      <button (click)="save()">
        {{ editing ? 'Update Expense' : 'Add Expense' }}
      </button>

      <button
        *ngIf="editing"
        class="cancel"
        (click)="reset()"
      >
        Cancel
      </button>

    </div>

  </div>


  <div class="table-card">

    <h2>Expense List</h2>

    <div class="table-container">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Expense Type</th>
            <th>Amount</th>
            <th>Expense Date</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let item of expenses">

            <td>{{ item.id }}</td>

            <td>{{ item.expenseType }}</td>

            <td>₹ {{ item.amount }}</td>

            <td>{{ item.expenseDate }}</td>

            <td>{{ item.description }}</td>

            <td class="actions">

              <button
                class="edit"
                (click)="edit(item)"
              >
                Edit
              </button>

              <button
                class="delete"
                (click)="delete(item.id)"
              >
                Delete
              </button>

            </td>

          </tr>


          <tr *ngIf="expenses.length === 0">

            <td
              colspan="6"
              class="no-data"
            >
              No expenses found
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
